<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restaurant Food Pricing</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Restaurant Food Pricing</h1>

        <form method="POST">
            <input type="text" name="name" placeholder="Food Item Name" required>
            <input type="number" step="0.01" name="price" placeholder="Base Price" required>
            <input type="number" step="0.01" name="tax" placeholder="Tax %" required>
            <input type="number" step="0.01" name="discount" placeholder="Discount %" required>
            <button type="submit">Add Item</button>
        </form>

        <h2>Menu Pricing</h2>
        <table>
            <tr>
                <th>Item</th>
                <th>Base Price</th>
                <th>Tax %</th>
                <th>Discount %</th>
                <th>Final Price</th>
            </tr>
            {% for item in menu %}
            <tr>
                <td>{{ item.name }}</td>
                <td>{{ item.base_price }}</td>
                <td>{{ item.tax }}</td>
                <td>{{ item.discount }}</td>
                <td>{{ item.final_price }}</td>
            </tr>
            {% endfor %}
        </table>
    </div>
</body>
</html>
